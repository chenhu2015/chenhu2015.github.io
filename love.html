<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>♥</title>
<link rel="icon" href="assets/img/headshot.jpg">
<style>
  :root {
    --bg: #fbfbf9;
    --fg: #1c1d1f;
    --muted: #5d6168;
    --accent: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517;
      --fg: #e8e8e6;
      --muted: #a1a5ab;
      --accent: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 72px; text-align: center; }
  p { font-size: 1.35rem; margin: 0 0 28px; }
  .heart { color: var(--accent); }
  img { width: 100%; height: auto; border-radius: 12px; display: block; }
  a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 32px; }
  @media (max-width: 560px) {
    main { padding: 36px 16px 56px; }
    p { font-size: 1.15rem; }
  }
</style>
</head>
<body>
<main>
  <p>么么哒！小漫漫，你永远是我的宝贝！<span class="heart">♥</span></p>
  <img src="assets/img/love.jpg" alt="Chen and his wife">
  <footer><a href="index.html">← 返回</a></footer>
</main>
</body>
</html>
